<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tekin Sovchi — Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f8fafc; user-select: none; }
    .blur-photo { filter: blur(8px); }
  </style>
</head>
<body class="pb-20">

  <!-- YUQORI HEADER -->
  <header class="bg-white p-4 shadow-sm flex justify-between items-center sticky top-0 z-10">
    <h1 class="text-xl font-bold text-rose-600">Tekin Sovchi</h1>
    <div class="flex items-center gap-3">
      <button class="p-2 bg-gray-100 rounded-full"><i class="fa-solid fa-sliders text-gray-600"></i></button>
      <button class="p-2 bg-gray-100 rounded-full"><i class="fa-regular fa-bell text-gray-600"></i></button>
    </div>
  </header>

  <!-- KATALOG BO'LIMI -->
  <main id="catalog-section" class="p-4 space-y-4">
    
    <!-- VIP NOMZODLAR DOSKASI -->
    <div class="bg-gradient-to-r from-amber-100 to-amber-200 border border-amber-300 rounded-2xl p-4 shadow-sm">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-bold bg-amber-500 text-white px-2 py-0.5 rounded-full"><i class="fa-solid fa-crown mr-1"></i> VIP NOMZODLAR</span>
        <span class="text-xs text-amber-800">Hammaga ko'rinadi</span>
      </div>
      <p class="text-sm font-medium text-amber-900">Profilingizni VIP qiling va birinchilardan bo'lib mosingizni toping!</p>
    </div>

    <!-- NOMZODLAR RO'YXATI CONTAINER -->
    <div id="candidates-container" class="space-y-4">
      <div class="text-center py-10 text-gray-500">Nomzodlar yuklanmoqda...</div>
    </div>
  </main>

  <!-- PASTKI NAVIGATSIYA MENYUSI (BOTTOM NAVIGATION) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-2 z-20">
    <button class="flex flex-col items-center text-rose-600 font-semibold text-xs">
      <i class="fa-solid fa-compass text-lg mb-0.5"></i> Katalog
    </button>
    <button class="flex flex-col items-center text-gray-400 text-xs">
      <i class="fa-regular fa-comment-dots text-lg mb-0.5"></i> Xabarlar
    </button>
    <button class="flex flex-col items-center text-gray-400 text-xs">
      <i class="fa-regular fa-bookmark text-lg mb-0.5"></i> Saqlangan
    </button>
    <button class="flex flex-col items-center text-gray-400 text-xs">
      <i class="fa-regular fa-user text-lg mb-0.5"></i> Men
    </button>
  </nav>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    // Telegram'dan foydalanuvchi ID sini olish (yoki test uchun 1234567)
    const userTelegramId = tg?.initDataUnsafe?.user?.id || 1234567;

    async function loadCatalog() {
      try {
        const res = await fetch(`/api/users/catalog/${userTelegramId}`);
        const result = await res.json();
        
        const container = document.getElementById('candidates-container');
        container.innerHTML = '';

        if (!result.data || result.data.length === 0) {
          container.innerHTML = `<div class="text-center py-10 text-gray-400">Hozircha sizga mos nomzodlar topilmadi.</div>`;
          return;
        }

        result.data.forEach(user => {
          const card = document.createElement('div');
          card.className = "bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex gap-4 items-center relative";
          
          card.innerHTML = `
            <div class="relative w-24 h-24 flex-shrink-0">
              <img src="${user.photoUrl || 'https://via.placeholder.com/100'}" class="w-full h-full object-cover rounded-xl ${user.isPhotoBlurred ? 'blur-photo' : ''}">
              <span class="absolute top-1 left-1 bg-rose-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-md">${user.matchPercentage}% Mos</span>
            </div>
            <div class="flex-grow">
              <div class="flex items-center gap-1">
                <h3 class="font-bold text-gray-800">${user.firstName}, ${user.age}</h3>
                ${user.isVerified ? '<i class="fa-solid fa-circle-check text-blue-500 text-xs"></i>' : ''}
              </div>
              <p class="text-xs text-gray-500 mt-0.5"><i class="fa-solid fa-location-dot mr-1"></i>${user.region}</p>
              <p class="text-xs text-gray-600 mt-1"><i class="fa-solid fa-briefcase mr-1"></i>${user.occupation || 'Ko\'rsatilmagan'}</p>
              <button class="mt-3 w-full bg-rose-500 hover:bg-rose-600 text-white text-xs py-2 rounded-xl font-medium transition">Suhbat boshlash</button>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error(err);
      }
    }

    loadCatalog();
  </script>
</body>
</html>
